name: Deprecate old MCP Registry listing
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
env:
  MCP_PUBLISHER_VERSION: v1.8.7
jobs:
  deprecate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Download and verify mcp-publisher
        run: |
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob --bundle "$RUNNER_TEMP/$archive.sigstore.json" --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/$MCP_PUBLISHER_VERSION" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$RUNNER_TEMP/$archive"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" mcp-publisher
      - name: Deprecate listing
        run: |
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          echo y | "$RUNNER_TEMP/mcp-publisher" status --status deprecated --all-versions --message "Moved to io.github.pdxlab/trustmodel-mcp" io.github.karlmehta/trustmodel-mcp
